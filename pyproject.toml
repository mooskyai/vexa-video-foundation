[project]
name = "vexa-video-foundation"
version = "0.1.0"
description = "From-scratch PyTorch research stack for generative video foundation models."
readme = "README.md"
requires-python = ">=3.14,<3.15"

dependencies = [
    "numpy>=2.5.3",
    "torch>=2.14.0",
]

[project.scripts]
vexa-video = "vexa_video.cli:main"


# ---------------------------------------------------------------------------
# uv package sources
# ---------------------------------------------------------------------------

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true


# ---------------------------------------------------------------------------
# Development dependencies
# ---------------------------------------------------------------------------

[dependency-groups]
dev = [
    "mypy>=1.18.0",
    "pytest>=8.4.0",
    "pytest-cov>=6.2.0",
    "ruff>=0.13.0",
]


# ---------------------------------------------------------------------------
# Build configuration
# ---------------------------------------------------------------------------

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vexa_video"]


# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


# ---------------------------------------------------------------------------
# MyPy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["vexa_video"]


# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

markers = [
    "gpu: requires a CUDA device",
    "slow: longer-running research test",
]